  .foot { padding: 9px 10px 12px; }

</style>

<script>
const $ = s => document.querySelector(s);
const board = $("#board");
const fill = v => v || `<span class="todo">[fill in]</span>`;
const MAIL = `mailto:${CONFIG.email}?subject=` + encodeURIComponent("Room in the Koramangala house") + "&body=" + encodeURIComponent("Hi! I saw the Koramangala house page. A bit about me:\n\n");

const SHARE_ICON = ICON("M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6");
let tab = "All";

document.querySelectorAll(".mail").forEach(a => a.href = MAIL);

// ----- tabs -----
TABS.forEach(([name, d]) => {
  const b = document.createElement("button");
  b.className = "pill";
  b.dataset.tab = name;
  b.innerHTML = ICON(d) + name;
  b.onclick = () => { tab = name; render(); window.scrollTo({ top: 0 }); };
  $("#pills").appendChild(b);
});

// ----- share: phone share sheet if there is one, otherwise copy the link -----
// Phone share sheet when there is one; otherwise copy the link. Always says what happened.
async function share() {
  const url = location.href;
  if (location.protocol === "file:") {
    toast("This page is a file on your computer. Put it online first, then this shares its link.");
    return;
  }
  if (navigator.share) {
    try { await navigator.share({ title: document.title, text: "Room for a female flatmate in a 4BHK house in Koramangala", url }); return; }
    catch (e) { if (e.name === "AbortError") return; }   // closed the share sheet: do nothing
  }
  toast(await copy(url) ? "Link copied" : "Couldn't copy. The link is: " + url);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const t = document.createElement("textarea");   // older browsers
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove();
  return ok;
}
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
}
$("#share").onclick = share;

// ----- dock -----
$("#dockHouse").onclick = () => {
  if (tab !== "All") { tab = "All"; render(); }
  window.scrollTo({ top: 0, behavior: "smooth" });
};
$("#dockMap").onclick = () => {
  if (tab !== "All") { tab = "All"; render(); }

// "Map" is highlighted while the map card is on screen, "House" otherwise
function updateDock() {
  const map = document.getElementById("where");
  const r = map && map.getBoundingClientRect();
  const onMap = !!r && r.top < innerHeight * 0.75 && r.bottom > 0;
  $("#dockMap").classList.toggle("on", onMap);
  $("#dockHouse").classList.toggle("on", !onMap);
}
addEventListener("scroll", updateDock, { passive: true });

// ----- cards -----
const thumb = n => `thumbs/IMG_${n}.jpg`;
const chev = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const imgs = ps => ps.map((n, i) => `<img src="${thumb(n)}" data-i="${i}" alt="" loading="lazy">`).join("");
const foot = c => `<div class="foot">${c.title ? `<div class="title">${c.title}</div>` : ""}${(c.src || [c.room]).map(s => `<div class="src">${s}</div>`).join("")}</div>`;
const openPhotos = (ps, i) => openLb(ps.map(n => ({ n, cap: PHOTOS[n][0] })), i);

function intro() {
  const all = ORDER;
  const el = document.createElement("section");
  el.className = "card intro";
  el.innerHTML = `
    <div class="media"><span class="badge">${all.length} photos</span><img src="photos/IMG_7229.jpg" alt=""></div>
    <div class="text">
      <h1>A 4BHK independent house in Koramangala, with 2 rooms open</h1>
      <div class="where">Near Wipro Signal · looking for 2 female flatmates, preferably in their 20s ·
        <a href="#where">see it on the map</a></div>
      <ul class="facts">
        <li><span>Rent</span><span>${CONFIG.rent}</span></li>
        <li><span>Deposit</span><span>${CONFIG.deposit}</span></li>
        <li><span>Move-in</span><span>${fill(CONFIG.moveIn)}</span></li>
      </ul>
      <div class="split">
        <div><div class="h">Private</div><ul>
          <li>Bedroom with an attached bathroom (every room has one)</li>
          <li>No balconies</li>
        </ul></div>
        <div><div class="h">Shared</div><ul>
          <li>Living room</li>
          <li>Dining area</li>
          <li>Kitchen</li>
          <li>Terrace with a utility room for washing and drying</li>
          <li>Washing and drying area by the kitchen</li>
          <li>Parking inside the gate</li>
        </ul></div>
      </div>
    </div>`;
  el.querySelector(".media").onclick = () => openPhotos(all, 0);
  return el;
}

// Returns the card and its rough height (in column widths) for balancing the columns.
function build(c) {
  const el = document.createElement("article");
  el.className = "card";
  if (c.id) el.id = c.id;
  const ps = c.photos || [];
  let html = ps.length > 1 ? `<span class="badge">${ps.length}</span>` : "";
  let h;

  if (c.kind === "quote") {
    el.classList.add("quote");
    html += `<div class="q">${c.q}</div><div class="meta">${c.src.map(s => `<div class="src">${s}</div>`).join("")}</div>`;
    h = 0.3 + c.q.length / 220;
  } else if (c.kind === "contact") {
    el.classList.add("quote");
    html += `<div class="q">Email me with a little about yourself, and we can chat, share more details, and arrange a visit.</div>
      <div class="btns"><a class="btn go" href="${MAIL}">${MAIL_ICON}${CONFIG.email}</a></div>
      <div class="meta"><div class="src">Know someone who's house hunting?</div>
      <div class="btns" style="margin-top:8px"><button class="btn share">${SHARE_ICON}<span>Send them this page</span></button></div></div>`;
    h = 0.75;
  } else if (c.kind === "map") {
    el.id = "where";
    html += `<div class="media mapbox"><iframe src="${GMAPS_EMBED}" title="Map of the area around Wipro Signal, Koramangala" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
      <div class="foot"><div class="title">Near Wipro Signal, Koramangala</div>
      <div class="src">The pin is the signal; I'll share the exact address when we talk · <a href="${GMAPS_LINK}" target="_blank" rel="noopener">open in Google Maps</a></div></div>`;
    h = 1 + 0.25;
  } else if (c.kind === "pano6") {
    html += `<div class="media pano6">${imgs(ps.slice(0, 1))}<div class="grid6">${ps.slice(1).map((n, i) => `<img src="${thumb(n)}" data-i="${i + 1}" alt="" loading="lazy">`).join("")}</div></div>` + foot(c);
    h = 1.3;
  } else if (c.kind === "grid6") {
    html += `<div class="media grid6">${imgs(ps)}</div>` + foot(c);
    h = 0.67 + 0.25;
  } else if (c.kind === "row4") {
    html += `<div class="media row4">${imgs(ps)}</div>` + foot(c);
    h = 0.45 + 0.2;
  } else if (c.kind === "carousel") {
    html += `<div class="media car"><div class="track">${imgs(ps)}</div>
      <button class="arrow prev" hidden aria-label="Previous">${chev("M15 5l-7 7 7 7")}</button>
      <button class="arrow next" aria-label="Next">${chev("M9 5l7 7-7 7")}</button></div>` + foot(c);
    h = 1.2 + 0.22;
  } else { // single
    const r = Math.min(R(ps[0]), 1.3);
    html += `<div class="media"><img src="${thumb(ps[0])}" data-i="0" alt="" loading="lazy" style="aspect-ratio:1/${r}"></div>` + foot(c);
    h = r + 0.2;
  }
  el.innerHTML = html;

  if (ps.length) {
    el.classList.add("photo");
    el.onclick = e => {
      if (e.target.closest(".arrow")) return;
      openPhotos(ps, e.target.dataset.i ? +e.target.dataset.i : 0);
    };
  }
  el.querySelectorAll(".share").forEach(b => b.onclick = share);

  const track = el.querySelector(".track");
  if (track) {
    const prev = el.querySelector(".arrow.prev"), next = el.querySelector(".arrow.next");
    const step = () => track.clientWidth - 19;
    prev.onclick = () => track.scrollBy({ left: -step(), behavior: "smooth" });
    next.onclick = () => track.scrollBy({ left: step(), behavior: "smooth" });
    track.addEventListener("scroll", () => {
      prev.hidden = track.scrollLeft < 10;
      next.hidden = track.scrollLeft > track.scrollWidth - track.clientWidth - 10;
    });
  }
  return [el, h + 0.28];
}

function render() {
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p.dataset.tab === tab));
  board.innerHTML = "";
  let list;
  if (tab === "All") {
    board.appendChild(intro());
    list = CARDS;
  } else {
    // Bedrooms: one card per bedroom with its bathroom. Other rooms: one card per photo.
    list = tab === "Bedrooms" ? CARDS.filter(c => c.room === "Bedrooms")
      : ORDER.filter(n => PHOTOS[n][1] === tab).map(n => ({ kind: "single", photos: [n], title: PHOTOS[n][0] || tab, src: PHOTOS[n][0] ? [tab] : [] }));
  }
  const wrap = document.createElement("div");
  wrap.className = "cols";
  board.appendChild(wrap);
  const cols = Array.from({ length: window.innerWidth <= 640 ? 1 : 2 }, () => {
    const d = document.createElement("div");
    d.className = "col";
    wrap.appendChild(d);
    return { d, h: 0 };
  });
  // each card goes into whichever column is currently shorter (real heights: images have fixed aspect ratios)
  const place = c => {
    const col = cols.reduce((x, y) => (y.d.offsetHeight < x.d.offsetHeight ? y : x));
    col.d.appendChild(build(c)[0]);
  };
  list.forEach(place);
  // finish with the map and the contact card, so they end the two columns next to each other
  (tab === "All" ? END : END.slice(1)).forEach(place);
  updateDock();
}
render();
let one = window.innerWidth <= 640;
window.addEventListener("resize", () => { if ((window.innerWidth <= 640) !== one) { one = !one; render(); } });

// ----- lightbox -----
const lb = $("#lb"), lbImg = lb.querySelector("img"), lbCap = lb.querySelector(".cap");
let set = [], cur = 0;
const full = n => `photos/IMG_${n}.jpg`;
function show(i) {
  cur = (i + set.length) % set.length;
  lbImg.src = full(set[cur].n);
  lbCap.textContent = set[cur].cap || "";
  if (set.length > 1) lbCap.insertAdjacentHTML("beforeend", `<span class="n">${cur + 1} / ${set.length}</span>`);
  lb.querySelector(".lprev").hidden = lb.querySelector(".lnext").hidden = set.length < 2;
  // load the photos on either side so swiping doesn't wait
  [1, -1].forEach(d => { if (set.length > 1) new Image().src = full(set[(cur + d + set.length) % set.length].n); });
}
function openLb(s, i) {
  set = s; show(i);
  lb.classList.add("open");
  document.documentElement.style.overflow = "hidden";   // the page behind doesn't scroll
}
function closeLb() {
  lb.classList.remove("open");
  document.documentElement.style.overflow = "";
}
lb.querySelector(".lprev").onclick = e => { e.stopPropagation(); show(cur - 1); };
lb.querySelector(".lnext").onclick = e => { e.stopPropagation(); show(cur + 1); };
lb.querySelector(".lclose").onclick = closeLb;
lb.onclick = e => { if (e.target === lb) closeLb(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "ArrowLeft") show(cur - 1);
  if (e.key === "ArrowRight") show(cur + 1);
  if (e.key === "Escape") closeLb();
});

// Touch: the photo follows the finger; swipe sideways for the next photo, swipe down to close
let t0 = null;
lb.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { t0 = null; return; }   // two fingers = pinch zoom, leave it alone
  t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  lbImg.classList.add("drag");
}, { passive: true });
lb.addEventListener("touchmove", e => {
  if (!t0 || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - t0.x, dy = e.touches[0].clientY - t0.y;
  if (Math.abs(dx) > Math.abs(dy)) lbImg.style.transform = `translateX(${dx}px)`;
  else if (dy > 0) { lbImg.style.transform = `translateY(${dy}px)`; lbImg.style.opacity = Math.max(.3, 1 - dy / 400); }
}, { passive: true });
lb.addEventListener("touchend", e => {
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.x, dy = e.changedTouches[0].clientY - t0.y;
  t0 = null;
  lbImg.classList.remove("drag");
  lbImg.style.transform = "";
  lbImg.style.opacity = "";
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && set.length > 1) show(cur + (dx < 0 ? 1 : -1));
  else if (dy > 90 && dy > Math.abs(dx)) closeLb();
});
</script>
</body>
</html>
